<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5EFE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Heard">
<title>Heard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --sand:#F5EFE6; --paper:#FBF8F3; --oat:#EBDDCB; --ink:#2B2125; --muted:#574A4D; --soft:#6B5D60;
  --plum:#5B2A4A; --plum-d:#3F1C33; --plum-t:#EFE3EA;
  --clay:#C07A5C; --clay-d:#9A5236; --clay-dd:#6E3620; --clay-t:#F3DCCF;
  --sage:#8A9D80; --sage-t:#E3E9DD; --sage-d:#3E5139; --sage-dd:#2F3F2B;
  --line:#CDBFB0; --field:#978676; --track:#DDD0C2;
  --bg:var(--sand); --fg:var(--ink); --primary:var(--plum); --on-primary:#FFFFFF; --accent:var(--plum); --done:var(--plum); --focus:var(--plum);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--sand);color:var(--ink);font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased}
body.is-night{background:#33192B}
body.is-white{background:#FFFFFF}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[tabindex="-1"]:focus{outline:none}

.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--fg)}
.night{--bg:#33192B;--fg:#F5EFE6;--muted:#D8C6CF;--soft:#D8C6CF;--paper:#4A2640;--line:#7A5470;--primary:#F5EFE6;--on-primary:#33192B;--accent:#F5EFE6;--track:#5A3550;--done:#E7B9A3;--focus:#E7B9A3;--oat:#4A2640}
.white{--bg:#FFFFFF;--fg:#1F1719}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 12px 0 8px;min-height:56px;padding-top:calc(12px + env(safe-area-inset-top))}
.topbar .mid{font-size:.875rem;font-weight:600;color:var(--muted);text-align:center}
.icon-btn{width:44px;height:44px;flex-shrink:0;border:0;background:none;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;color:inherit;padding:0}
.icon-btn.filled{background:var(--oat)}
.text-btn{min-height:44px;padding:0 8px;border:0;background:none;font-weight:600;color:var(--accent);font-size:.9375rem;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.spacer{width:44px;flex-shrink:0}
.brand{margin:0;font-family:'Fraunces',Georgia,serif;font-size:1.375rem;font-weight:600;color:var(--plum);padding-left:16px}

.progress{display:flex;gap:4px;padding:6px 24px 0}
.progress span{flex:1;height:4px;border-radius:2px;background:var(--track);overflow:hidden;position:relative}
.progress span i{position:absolute;inset:0 auto 0 0;background:var(--done);border-radius:2px}

.content{flex:1;padding:20px 24px 24px;display:flex;flex-direction:column;gap:22px}
.display{font-family:'Fraunces',Georgia,serif;font-weight:500;font-size:1.875rem;line-height:1.15;letter-spacing:-.015em;margin:0}
.display.xl{font-size:2.125rem;line-height:1.12}
.lede{margin:8px 0 0;color:var(--muted);font-size:1rem}
.label{display:block;font-weight:700;font-size:.9375rem;margin:0 0 10px;padding:0}
.label .opt{font-weight:400;color:var(--muted)}
.help{font-size:.875rem;color:var(--muted);margin:8px 0 0}
.error{font-size:.875rem;color:#9B2C2C;font-weight:600;margin:8px 0 0}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{padding:0}
.section-label{font-size:.8125rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}

.field{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--field);background:#FBF8F3;font-size:1rem;line-height:1.45;color:#2B2125;min-height:50px}
textarea.field{resize:vertical;min-height:104px;display:block}
.night .field{border-color:#9C7A92;background:#F5EFE6}
.row{display:flex;gap:8px;align-items:stretch}
.field.datetime{display:block;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left}
.field.datetime::-webkit-date-and-time-value{text-align:left}
.row input[type="date"]{-webkit-appearance:none;appearance:none;min-width:0}
.row .field{flex:1;min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 14px;border-radius:22px;border:1.5px solid var(--line);background:var(--paper);font-size:.9375rem;font-weight:500;display:inline-flex;align-items:center;gap:6px;color:var(--fg)}
.chip[aria-pressed="true"]{border-color:var(--plum);background:var(--plum-t);color:var(--plum-d);font-weight:600;padding-left:10px}
.night .chip[aria-pressed="true"]{border-color:#E7B9A3;background:#5A3550;color:#F5EFE6}
.chip.add{border-style:dashed;border-color:var(--field);background:transparent;color:var(--accent);font-weight:600;padding-left:10px}

.seg{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:4px;padding:4px;border-radius:16px;background:var(--oat)}
.seg button{min-height:44px;border:0;border-radius:12px;background:transparent;font-size:.9375rem;color:#3A2F31;padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--paper);font-weight:700;color:var(--ink);box-shadow:0 1px 3px rgba(43,33,37,.14)}

.radio-list{display:flex;flex-direction:column;gap:8px}
.radio-card{display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 16px;border-radius:18px;background:var(--paper);border:2px solid transparent;cursor:pointer}
.radio-card:has(input:checked){border-color:var(--plum);background:var(--plum-t)}
.radio-card input{width:22px;height:22px;margin:0;flex-shrink:0;accent-color:var(--plum)}
.radio-card .t{display:block;font-size:1.0625rem;font-weight:600}
.radio-card .d{display:block;font-size:.875rem;color:var(--muted)}

.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.scale button{min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--paper);font-size:1.0625rem;font-weight:600;color:var(--ink)}
.scale button[aria-pressed="true"]{background:var(--plum);border-color:var(--plum);color:#fff}
.scale-word{margin:8px 0 0;font-size:.9375rem;font-weight:600;color:var(--plum);min-height:1.5em}
.scale-ends{display:flex;justify-content:space-between;font-size:.8125rem;color:var(--muted);margin-top:6px}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:28px;border:0;background:var(--primary);color:var(--on-primary);font-size:1.0625rem;font-weight:600;text-decoration:none;padding:0 20px;text-align:center}
.btn.outline{background:transparent;border:2px solid var(--primary);color:var(--primary)}
.btn.sm{min-height:48px;font-size:1rem;border-radius:24px}
.btn.quiet{background:var(--oat);color:var(--ink)}
.skip{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;border:0;background:none;color:var(--accent);font-size:1rem;font-weight:600}
.footer{position:sticky;bottom:0;padding:12px 24px calc(16px + env(safe-area-inset-bottom));background:var(--bg);display:flex;flex-direction:column;gap:2px;z-index:2}

.lock{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 9px;border-radius:999px;background:var(--sage-t);color:var(--sage-d);font-size:.8125rem;font-weight:600;align-self:flex-start}
.night .lock{background:#4A2640;color:#E3E9DD}
.tip{padding:12px 14px;border-radius:14px;background:var(--sage-t);color:var(--sage-dd);font-size:.875rem;margin:0}
.note{padding:16px 18px;border-radius:18px;background:var(--oat);font-size:.9375rem;margin:0}
.card{background:var(--paper);border-radius:20px;padding:18px}
.card h2{margin:0}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.card-head .section-label{margin:0}
.badge{flex-shrink:0;padding:4px 10px;border-radius:999px;font-size:.8125rem;font-weight:700;background:var(--clay-t);color:var(--clay-dd)}
.badge.sage{background:var(--sage-t);color:var(--sage-dd)}
.empty{border:1.5px dashed var(--line);background:transparent;text-align:center;padding:28px 22px;border-radius:24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.muted{color:var(--muted)}

.qlist{display:flex;flex-direction:column;gap:6px}
.qrow{display:flex;align-items:center;gap:2px;min-height:52px;padding:4px 2px 4px 14px;border-radius:16px;background:var(--paper)}
.qrow p{flex:1;margin:0;font-size:.9375rem;line-height:1.4}
.qrow.on p{font-weight:600}
.star{color:var(--soft)}
.star[aria-pressed="true"]{color:var(--clay-d)}

.impact{display:grid;grid-template-columns:minmax(84px,1.3fr) repeat(4,minmax(0,1fr));column-gap:4px;row-gap:8px;align-items:center}
.impact .h{font-size:.75rem;font-weight:600;color:var(--muted);text-align:center;line-height:1.2}
.impact .r{font-size:.9375rem;font-weight:600;line-height:1.25}
.impact button{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;color:#fff;padding:0}
.impact button[aria-pressed="true"]{background:var(--plum);border-color:var(--plum)}

.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.topics button{min-height:56px;padding:10px 14px;border-radius:16px;background:#4A2640;border:1.5px solid transparent;color:#F5EFE6;font-size:.9375rem;font-weight:600;line-height:1.3;text-align:left;display:flex;align-items:center;gap:6px}
.topics button.ghost{background:transparent;border-color:#7A5470}
.phrase{width:100%;text-align:left;min-height:48px;padding:12px 14px;border-radius:16px;border:1.5px solid #7A5470;background:transparent;color:#F5EFE6;font-size:.9375rem;line-height:1.4;display:flex;gap:10px;align-items:flex-start}
.phrase[aria-pressed="true"]{border-color:#E7B9A3;background:#4A2640}
.phrase svg{flex-shrink:0;margin-top:1px}
.notecard{background:#4A2640;border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;padding:4px 14px;border-radius:14px;background:var(--paper)}
.switch input{width:22px;height:22px;flex-shrink:0;accent-color:var(--plum)}
.night .switch input{accent-color:#E7B9A3}
.crisis{padding:14px 16px;border-radius:16px;background:#F5EFE6;color:#2B2125;font-size:.9375rem;margin:0;border:2px solid #C07A5C}
.crisis a{color:#5B2A4A;font-weight:700}
.group-label{margin:14px 0 8px;font-size:.8125rem;font-weight:600;color:var(--muted)}
.group-label:first-child{margin-top:0}

.appt{background:var(--paper);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px}
.appt .t{margin:0;font-size:1.125rem;font-weight:700}
.appt .s{margin:2px 0 0;font-size:.9375rem;color:var(--muted)}
.minibar{display:flex;gap:4px}
.minibar span{flex:1;height:6px;border-radius:3px;background:var(--track)}
.minibar span.on{background:var(--plum)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.actions .btn{flex:1 1 140px;width:auto}

.act-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.act-grid .wide{grid-column:span 2}
.tile{min-height:64px;border-radius:18px;border:0;background:var(--oat);font-size:.875rem;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--ink)}
.timeline{list-style:none;margin:12px 0 0;padding:0}
.timeline li{display:flex;gap:12px}
.timeline .dot{display:flex;flex-direction:column;align-items:center;width:14px;flex-shrink:0}
.timeline .dot b{width:12px;height:12px;border-radius:6px;background:var(--clay-t);border:2px solid var(--clay);margin-top:5px}
.timeline .dot i{flex:1;width:2px;background:var(--track)}
.timeline li:last-child .dot b{background:var(--plum);border-color:var(--plum)}
.timeline .k{margin:0;font-size:.875rem;font-weight:700;color:var(--muted)}
.timeline .v{margin:2px 0 0;padding-bottom:12px}
.dl{display:grid;grid-template-columns:minmax(96px,auto) 1fr;row-gap:6px;column-gap:12px;margin:12px 0 0;font-size:.9375rem}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:600}
.bars{display:grid;grid-template-columns:minmax(96px,auto) 1fr auto;row-gap:10px;column-gap:10px;align-items:center;font-size:.9375rem;margin-top:10px}
.bars .bar{height:8px;border-radius:4px;background:var(--oat);overflow:hidden}
.bars .bar i{display:block;height:100%;background:var(--plum)}
.hardcard{background:#33192B;color:#F5EFE6;border-radius:20px;padding:18px}
.hardcard .section-label{color:#D8C6CF}
.danger{color:#9B2C2C}

.steps-list{display:flex;flex-direction:column;gap:6px}
.check-row{display:flex;align-items:center;gap:12px;min-height:48px;padding:4px 4px 4px 14px;border-radius:14px;background:var(--paper)}
.check-row input{width:22px;height:22px;margin:0;flex-shrink:0;accent-color:var(--plum)}
.check-row span{flex:1}
.check-row.done span{text-decoration:line-through;color:var(--muted)}

/* clinician */
.clin-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px 10px 20px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--sand);border-bottom:1px solid #E2D8CC}
.clin{padding:28px 24px 32px;display:flex;flex-direction:column;gap:26px;font-size:1.0625rem;color:#1F1719}
.clin.big{font-size:1.25rem}
.clin h2{margin:0 0 10px;font-size:.875rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--plum)}
.clin .hello{margin:0;font-family:'Fraunces',Georgia,serif;font-size:1.625em;line-height:1.25;font-weight:500}
.clin .meta{margin:10px 0 0;font-size:.9em;color:var(--muted)}
.clin .boxed{padding:20px;border-radius:16px;background:var(--sand)}
.clin .main{margin:0;font-size:1.25em;line-height:1.4;font-weight:600}
.clin ol{margin:0;padding-left:1.5em;display:flex;flex-direction:column;gap:8px;font-size:1.1em}
.clin ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.clin table{width:100%;border-collapse:collapse;font-size:.95em}
.clin th,.clin td{text-align:left;padding:10px 8px 10px 0;border-bottom:1px solid #E2D8CC;vertical-align:top}
.clin thead th{font-size:.8em;color:var(--muted);border-bottom:2px solid #1F1719;padding-top:0}
.clin .quote{margin:0;font-size:1.1em;line-height:1.45}
.clin .hard{padding:20px;border-radius:16px;border:2px solid var(--plum)}
.clin .foot{margin:0;padding-top:18px;border-top:1px solid #E2D8CC;font-size:.8em;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);background:#2B2125;color:#fff;padding:12px 18px;border-radius:14px;font-size:.9375rem;width:max-content;max-width:min(90vw,420px);opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:10;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

@media print{
  @page{margin:16mm}
  body,body.is-white{background:#fff}
  .no-print{display:none !important}
  .screen{min-height:0}
  .clin{padding:0;font-size:12pt}
  .clin .boxed{background:#F5EFE6;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #app{max-width:none}
}
</style>
</head>
<body>
<div id="app" aria-live="off"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input id="restoreFile" type="file" accept="application/json,.json" class="sr-only" tabindex="-1" aria-hidden="true">
<noscript><p style="padding:24px">Heard needs JavaScript turned on to work.</p></noscript>
<script>
(function(){
'use strict';

/* ---------- icons ---------- */
function svg(p, size, sw, fill){ size=size||24; sw=sw||2; fill=fill||'none';
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="'+fill+'" stroke="currentColor" stroke-width="'+sw+'" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+p+'</svg>'; }
var P = {
  back:'<path d="M15 18l-6-6 6-6"/>',
  close:'<path d="M6 6l12 12M18 6L6 18"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  star:'<path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  edit:'<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  speaker:'<path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6"/>',
  stop:'<rect x="6" y="6" width="12" height="12" rx="2"/>',
  download:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  phone:'<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 17h2"/>',
  cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',
  clock:'<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>',
  out:'<path d="M7 17L17 7M9 7h8v8"/>',
  settings:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'
};
function ic(name, size, sw, fill){ return svg(P[name], size, sw, fill); }

/* ---------- content ---------- */
/* body options: only decide what is suggested first. Nothing is ever hidden for good. */
var BODY = [
  ['periods','I have periods'],
  ['vulva','I have a vagina, vulva or cervix'],
  ['penis','I have a penis and testicles'],
  ['meno','I’m going through or past menopause']
];
var TYPES = [
  {id:'gp', label:'GP appointment', desc:'At your surgery, by phone or video'},
  {id:'mental', label:'Mental health', desc:'GP, talking therapy or a specialist'},
  {id:'sexual', label:'Sexual health clinic', desc:'Testing, symptoms, PrEP or advice'},
  {id:'urology', label:'Bladder, prostate or genitals', desc:'Urology, or penis and testicle checks'},
  {id:'gynae', label:'Gynaecology', desc:'Periods, pelvic pain, womb or ovaries', body:['periods','vulva','meno']},
  {id:'smear', label:'Smear test', desc:'Cervical screening, usually with a nurse', body:['vulva']},
  {id:'contra', label:'Contraception', desc:'Starting, switching or stopping'},
  {id:'meno', label:'Menopause', desc:'Perimenopause, HRT or symptoms', body:['periods','vulva','meno']},
  {id:'other', label:'Something else', desc:'Fertility, a long-term condition, anything'}

  var past = isPast(a), d = daysUntil(a.date), when = a.date ? fmtDate(a.date) + (a.time ? ' · ' + a.time : '') : 'No date yet';
  var badge = '';
  if (a.status === 'done' && a.heard.rating) badge = '<span class="badge sage">'+esc(a.heard.rating)+'</span>';
  else if (!past && d != null) badge = '<span class="badge">'+(d === 0 ? 'Today' : d === 1 ? 'Tomorrow' : 'In '+d+' days')+'</span>';
  var body = '', acts = '';
  if (a.status === 'prep') {

    var todo = a.after.steps.filter(function(s){ return !s.done; }).length;
    var unanswered = starred(a).filter(function(q){ return !a.after.answered[q.id]; }).length;

function clinicianBody(a){
  var st = starred(a), rest = (a.questions||[]).filter(function(q){ return !q.starred; });

  var rows = cols ? a.what.chips.map(function(c){ return '<tr><th scope="row">'+esc(c)+'</th>'+(since?'<td>'+esc(since)+'</td>':'')+(t.often?'<td>'+esc(t.often)+'</td>':'')+'</tr>'; }).join('') : '';

  if (main) h += '<section class="boxed"><h2>Main concern</h2><p class="main">'+esc(main)+'</p></section>';
  if (a.what.chips.indexOf(CRISIS_CHIP) >= 0) h += '<section class="hard"><h2>Please don’t miss this</h2><p class="quote">I’ve been having thoughts of not wanting to be here.</p></section>';
  if (st.length) h += '<section><h2>What I most want to ask</h2><ol>'+st.map(function(q){ return '<li>'+esc(q.text)+'</li>'; }).join('')+'</ol></section>';
  if (rows || plainList || a.what.text || since || t.trend) {
    h += '<section><h2>Symptoms</h2>';

    if (s.typical) dl += '<dt>Typical day</dt><dd>'+s.typical+' of 5, '+SEV[s.typical].toLowerCase()+'</dd>';
    if (s.bad) dl += '<dt>Bad day</dt><dd>'+s.bad+' of 5, '+SEV[s.bad].toLowerCase()+'</dd>';

    if (s.worse.length) dl += '<dt>Makes it worse</dt><dd style="font-weight:400">'+esc(listJoin(s.worse))+'</dd>';

  else if (rest.length && !st.length) h += '<section><h2>Questions I’d like to ask</h2><ol>'+rest.slice(0,6).map(function(q){ return '<li>'+esc(q.text)+'</li>'; }).join('')+'</ol></section>';
  h += '<p class="foot">Written by the patient with Heard, to help them say what they need to. These are their own words and ratings, not a diagnosis.</p>';
  return h;
}

function summaryText(a){
  var parts = [], st = starred(a), s = a.severity, t = a.timing;
  parts.push('Hello. I’ve written a few notes so I don’t forget anything.');
  var m = mainText(a); if (m) parts.push('My main concern is: ' + m);
  if (a.what.text) parts.push(a.what.text);
  if (t.since || t.roughly) parts.push('I first noticed it ' + (t.roughly || t.since).toLowerCase() + '.');
  if (t.often) parts.push('It happens: ' + t.often.toLowerCase() + '.');
  if (t.trend === 'Worse') parts.push('It’s getting worse.');
  if (s.typical) parts.push('On a typical day it’s ' + s.typical + ' out of 5, ' + SEV[s.typical].toLowerCase() + '.');
  if (s.bad) parts.push('On a bad day it’s ' + s.bad + ' out of 5, ' + SEV[s.bad].toLowerCase() + '.');
  var lv = IMPACT.filter(function(r){ return a.impact[r[0]] >= 2; }).map(function(r){ return r[1].toLowerCase(); });
  if (lv.length) parts.push('It’s affecting my ' + listJoin(lv) + ' a lot.');
  if (a.impact.example) parts.push(a.impact.example);
  a.hard.filter(function(n){ return n.include; }).forEach(function(n){ parts.push(n.text); });
  if (st.length) parts.push('The questions I most want to ask are: ' + st.map(function(q,i){ return (i+1) + '. ' + q.text; }).join(' '));
  return parts.join(' ');
}

  skipSetup: function(){ if (!db.profile) db.profile = {name:'', age:''}; db.onboarded = true; ui.setupErr=''; save(); go('home'); },
  newAppt: function(){ var a = blankAppt(); db.appts.push(a); ui.apptId = a.id; ui.allTypes = ui.allSymptoms = ui.allTopics = ui.crisisOpen = false; save(); goStep('type'); },
  toggleBody: function(k){ var p = db.profile || (db.profile = {name:'', age:''}); var b = p.body || (p.body = []); var i = b.indexOf(k); if (i >= 0) b.splice(i,1); else b.push(k); save(); render(); },
  showAll: function(k){ ui[k] = true; render(); },
  toggleCrisis: function(){ ui.crisisOpen = !ui.crisisOpen; render(); },
  open: function(id){ ui.apptId = id; var a = cur(); goStep(a.lastStep || 'type'); },
  openSummary: function(id){ ui.apptId = id; go('summary'); },
  next: function(){ var i = STEPS.indexOf(ui.step); save(); if (i >= STEPS.length - 1) toSummary(); else goStep(STEPS[i+1]); },
  prev: function(){ var i = STEPS.indexOf(ui.step); if (i <= 0) { save(); go('home'); } else goStep(STEPS[i-1]); },
  exit: function(){ save(); go('home'); toast('Saved. Pick up whenever you’re ready.'); },
  editStep: function(step){ ui.apptId = ui.apptId; goStep(step); },
  setMode: function(v){ cur().mode = v; save(); render(); },
  setVal: function(arg){ var s = split(arg), p = 'a.'+s[0]; setPath(p, getPath(p) === s[1] ? null : s[1]); save(); render(); },
  setNum: function(arg){ var s = split(arg), p = 'a.'+s[0], n = Number(s[1]); setPath(p, getPath(p) === n ? null : n); save(); render(); },
  toggleIn: function(arg){ var s = split(arg); toggleArr(s[0], s[1]); save(); render(); },
  showAddChip: function(){ ui.addingChip = true; render(); focusId('newChip'); },
  addChip: function(){ var v = (ui.newChip||'').trim(); if (!v) { focusId('newChip'); return; } var arr = cur().what.chips; if (arr.indexOf(v) < 0) arr.push(v); ui.newChip=''; ui.addingChip=false; save(); render(); },
  openTopic: function(k){ ui.draft = {id:null, topic:k, text:'', include:true}; go('topic'); },
  editNote: function(id){ var n = cur().hard.filter(function(x){ return x.id === id; })[0]; if (!n) return; ui.draft = {id:n.id, topic:n.topic, text:n.text, include:n.include}; go('topic'); },
  closeTopic: function(){ ui.step = 'hard'; go('step'); },
  phrase: function(i){
    var t = TOPICS[ui.draft.topic], list = phrasesFor(t).concat([HARD_WORDS]), p = list[+i], txt = ui.draft.text || '';
    if (txt.indexOf(p) >= 0) txt = txt.replace(p, '').replace(/[ \t]{2,}/g, ' ').trim(); else txt = (txt.trim() ? txt.trim() + ' ' : '') + p;
    ui.draft.text = txt; render();
  },
  saveNote: function(){
    var d = ui.draft, a = cur(), text = (d.text||'').trim();
    if (text) {
      if (d.id) a.hard.forEach(function(n){ if (n.id === d.id) { n.text = text; n.include = !!d.include; } });
      else a.hard.push({id:uid(), topic:d.topic, text:text, include:!!d.include});
      save(); toast(d.include ? 'Saved. It’ll go in your summary.' : 'Saved, just for you.');
    }
    ui.draft = null; ui.step = 'hard'; go('step');
  },
  toggleInclude: function(id){ cur().hard.forEach(function(n){ if (n.id === id) n.include = !n.include; }); save(); render(); },
  delNote: function(id){ if (ui.confirm !== id) { ui.confirm = id; render(); toast('Tap the bin again to delete.'); return; } var a = cur(); a.hard = a.hard.filter(function(n){ return n.id !== id; }); ui.confirm = null; save(); render(); },
  star: function(id){
    var a = cur(), q = a.questions.filter(function(x){ return x.id === id; })[0];
    if (!q.starred && starred(a).length >= 3) { toast('You’ve starred 3. Unstar one to swap it in.'); return; }
    q.starred = !q.starred; save(); render();
  },
  addQ: function(){ var v = (ui.newQ||'').trim(); if (!v) { focusId('nq'); return; } var a = cur(), canStar = starred(a).length < 3; a.questions.push({id:uid(), text:v, starred:canStar, own:true}); ui.newQ=''; save(); render(); focusId('nq'); if (canStar) toast('Added and starred.'); },
  removeQ: function(id){ var a = cur(); a.questions = a.questions.filter(function(q){ return q.id !== id; }); save(); render(); },
  readAloud: function(){
    if (!('speechSynthesis' in window)) { toast('Read aloud isn’t available in this browser.'); return; }
    if (ui.speaking) { speechSynthesis.cancel(); ui.speaking = false; render(); return; }
    var u = new SpeechSynthesisUtterance(summaryText(cur())); u.lang = 'en-GB'; u.rate = 0.95;
    var v = speechSynthesis.getVoices().filter(function(x){ return /en-GB/i.test(x.lang); })[0]; if (v) u.voice = v;
    u.onend = u.onerror = function(){ ui.speaking = false; if (ui.route === 'summary') render(); };
    ui.speaking = true; speechSynthesis.speak(u); render();
  },
  pdf: function(){ go('clinician'); setTimeout(function(){ window.print(); }, 350); },
  bigText: function(){ ui.big = !ui.big; render(); },
  ics: function(kind){
    var a = cur(), date = kind === 'followup' ? a.after.followUp : a.date, time = kind === 'followup' ? '' : a.time;
    if (!date) { toast('Add a date first.'); return; }
    var d = date.replace(/-/g,''), start, end;
    if (time) { var dt = new Date(date+'T'+time), e = new Date(dt.getTime() + 30*60000);
      start = 'DTSTART:'+d+'T'+time.replace(':','')+'00'; end = 'DTEND:'+ymd(e).replace(/-/g,'')+'T'+pad(e.getHours())+pad(e.getMinutes())+'00'; }
    else { var nd = new Date(date+'T00:00'); nd.setDate(nd.getDate()+1); start = 'DTSTART;VALUE=DATE:'+d; end = 'DTEND;VALUE=DATE:'+ymd(nd).replace(/-/g,''); }
    var stamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
    var lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Heard//EN','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+a.id+'-'+kind+'@heard.local','DTSTAMP:'+stamp,start,end,
      'SUMMARY:'+(kind==='followup'?'Follow-up appointment':'Appointment'),'DESCRIPTION:Open Heard to look over your notes.',
      'BEGIN:VALARM','TRIGGER:-PT12H','ACTION:DISPLAY','DESCRIPTION:Look over your notes in Heard','END:VALARM','END:VEVENT','END:VCALENDAR'];
    download(kind === 'followup' ? 'follow-up.ics' : 'appointment.ics', lines.join('\r\n'), 'text/calendar');
    toast('Calendar file downloaded. Open it to add the event.');
  },
  after: function(id){ ui.apptId = id; go('after'); },
  addStep: function(){ var v = (ui.newStep||'').trim(); if (!v) { focusId('ns'); return; } cur().after.steps.push({id:uid(), text:v, done:false}); ui.newStep=''; save(); render(); focusId('ns'); },
  toggleStep: function(id){ cur().after.steps.forEach(function(s){ if (s.id === id) s.done = !s.done; }); save(); render(); },
  delStep: function(id){ var a = cur(); a.after.steps = a.after.steps.filter(function(s){ return s.id !== id; }); save(); render(); },
  toggleAnswered: function(id){ var m = cur().after.answered; m[id] = !m[id]; save(); render(); },
  finishHeard: function(){ var a = cur(); a.status = 'done'; save(); go('home'); toast('Saved. Look after yourself.'); },
  followUp: function(id){
    var old = db.appts.filter(function(x){ return x.id === id; })[0], a = blankAppt();
    a.type = old.type; a.date = old.after.followUp || ''; a.who = old.who;
    a.what = {text:old.what.text, chips:old.what.chips.slice()};
    var carry = starred(old).filter(function(q){ return !old.after.answered[q.id]; });
    ensureQuestions(a);
    carry.forEach(function(q){ a.questions.unshift({id:uid(), text:q.text, starred:true, own:true}); });
    db.appts.push(a); ui.apptId = a.id; save(); goStep('type');
    toast(carry.length ? 'Started. Your unanswered questions came with you.' : 'Started your follow-up prep.');
  },
  delAppt: function(){ var a = cur(), key = 'del-'+a.id; if (ui.confirm !== key) { ui.confirm = key; render(); return; } db.appts = db.appts.filter(function(x){ return x.id !== a.id; }); ui.apptId = null; save(); go('home'); toast('Appointment deleted.'); },
  backup: function(){ download('heard-backup-'+todayStr()+'.json', JSON.stringify(db, null, 2), 'application/json'); toast('Backup downloaded. Keep it somewhere private.'); },
  restore: function(){ document.getElementById('restoreFile').click(); },
  wipe: function(){ if (ui.confirm !== 'wipe') { ui.confirm = 'wipe'; render(); return; } try { localStorage.removeItem(KEY); } catch(e){} db = fresh(); ui.apptId = null; go('welcome'); toast('Everything has been deleted from this device.'); }
};

document.getElementById('restoreFile').addEventListener('change', function(e){
  var f = e.target.files && e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(){ try { var d = JSON.parse(r.result); if (!d || !Array.isArray(d.appts)) throw 0; d.appts.forEach(normalise); d.onboarded = true; db = d; save(); go('home'); toast('Backup restored.'); } catch(err){ toast('That file doesn’t look like a Heard backup.'); } e.target.value = ''; };
  r.readAsText(f);
});

function focusId(id){ setTimeout(function(){ var el = document.getElementById(id); if (el) el.focus(); }, 0); }

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]'); if (!el) return;
  var fn = H[el.getAttribute('data-act')]; if (!fn) return;
  if (el.tagName !== 'INPUT') e.preventDefault();
  fn(el.getAttribute('data-arg'), el);
});
document.addEventListener('input', function(e){
  var el = e.target; var path = el.getAttribute && el.getAttribute('data-bind'); if (!path) return;
  setPath(path, el.type === 'checkbox' ? el.checked : el.value);
  if (path.indexOf('ui.') !== 0) save();
});
document.addEventListener('change', function(e){
  var el = e.target, path = el.getAttribute && el.getAttribute('data-set');
  if (path) { setPath(path, el.value); save(); render(); return; }
  var b = el.getAttribute && el.getAttribute('data-bind');
  if (b && el.type === 'checkbox') { setPath(b, el.checked); }
});
document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter') return; var el = e.target, act = el.getAttribute && el.getAttribute('data-enter');
  if (act && H[act]) { e.preventDefault(); H[act](); }
});
window.addEventListener('afterprint', function(){ if (ui.route === 'clinician') toast('Tip: choose “Save as PDF” as the printer to keep a copy.'); });

/* ---------- render ---------- */
function render(newScreen){
  var view = V[ui.route] || V.home;
  var y = window.scrollY;
  document.getElementById('app').innerHTML = view();
  var night = (ui.route === 'topic') || (ui.route === 'step' && ui.step === 'hard');
  document.body.classList.toggle('is-night', night);
  document.body.classList.toggle('is-white', ui.route === 'clinician');
  var meta = document.querySelector('meta[name=theme-color]'); if (meta) meta.setAttribute('content', night ? '#33192B' : ui.route === 'clinician' ? '#F5EFE6' : '#F5EFE6');
  if (newScreen) {
    window.scrollTo(0,0);
    var h = document.querySelector('h1[tabindex]'); if (h) h.focus({preventScroll:true});
    document.title = ui.route === 'clinician' ? 'Notes for my clinician' : 'Heard';
  } else window.scrollTo(0,y);
}
render(true);
})();
</script>
</body>
</html>
